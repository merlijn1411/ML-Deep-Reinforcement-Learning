behaviors:
  Seeker:
    trainer_type: ppo
    #init_path: results\ppo\Seeker\checkpoint.pt
    checkpoint_interval: 5000000
    keep_checkpoints: 5
    max_steps: 10000000
    threaded: true
    time_horizon: 64
    summary_freq: 5000

    hyperparameters:
      batch_size:   512 
      buffer_size:  5120  
      learning_rate: 0.0005 
      beta: 0.003
      epsilon: 0.2 
      lambd: 0.95
      num_epoch: 7
      learning_rate_schedule: linear   
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 4
      vis_encode_type: simple
      encoding_size: 64
      inference_batch_size: 16
      memory:
        sequence_length: 512 
        memory_size: 256

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.1
        learning_rate: 3e-4
    
    self_play: 
      save_steps: 20000
      swap_steps: 30000
      play_against_latest_model_ratio: 0.7
      initial_elo:  1200
      window: 5
      log_path: "results"
  
  Runner:
    trainer_type: ppo
    #init_path: results\ppo\Runner\checkpoint.pt
    checkpoint_interval: 5000000
    keep_checkpoints: 5
    max_steps: 10000000
    threaded: true
    time_horizon: 64
    summary_freq: 5000

    hyperparameters:
      batch_size:   512 
      buffer_size:  5120  
      learning_rate: 0.0005 
      beta: 0.003
      epsilon: 0.2 
      lambd: 0.95
      num_epoch: 7
      learning_rate_schedule: linear 
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 4
      vis_encode_type: simple
      encoding_size: 64
      inference_batch_size: 16
      memory:
        sequence_length: 512 
        memory_size: 256

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.1
        learning_rate: 3e-4
    
    self_play: 
      save_steps: 20000
      swap_steps: 30000
      play_against_latest_model_ratio: 0.7
      initial_elo: 1200
      window: 5
      log_path: "results"

environment_parameters:
  TrainingArea_Seeker:
    curriculum:
      - name: Easy
        completion_criteria:
          measure: reward
          behavior: "Seeker"
          signal_smoothing: true
          min_lesson_length: 2
          threshold: 0.75
        value: 5

      - name: Medium
        completion_criteria:
          measure: reward
          behavior: "Seeker"
          signal_smoothing: true
          min_lesson_length: 4
          threshold: 0.90
        value: 6

      - name: Hard
        completion_criteria:
          measure: reward
          behavior: "Seeker"
          signal_smoothing: true
          min_lesson_length: 6
          threshold: 1
        value: 7
      - name: Completion
        value: 8

  TrainingArea_Runner:
    curriculum:
      - name: Easy
        completion_criteria:
          measure: reward
          behavior: "Runner"
          signal_smoothing: true
          min_lesson_length: 2
          threshold: 0.75
        value: 0
        
      - name: Medium
        completion_criteria:
          measure: reward
          behavior: "Runner"
          signal_smoothing: true
          min_lesson_length: 4
          threshold: 0.90
        value: 0

      - name: Hard
        completion_criteria:
          measure: reward
          behavior: "Runner"
          signal_smoothing: true
          min_lesson_length: 6
          threshold: 1
        value: 0
      - name: Completion
        value: 0
